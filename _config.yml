title_separator: "-"
description: "Chuqin Zhou — Master’s student at Shanghai Jiao Tong University"
url: "https://qin921.github.io"
baseurl: ""
repository: QIN921/QIN921.github.io
author:
  avatar: github-avatar.jpg
