  - requirements.txt
  - mkdocs.yml
  - MIGRATION.md
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
      read_time: false
compress_html:
  clippings: all
  ignore:
    envs: development
